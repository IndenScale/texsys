[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-sheet"
version = "0.1.0"
description = "Composable engineering sheets from design components and project content"
requires-python = ">=3.11"
dependencies = ["texsys"]

[project.entry-points."texsys.packages"]
sheet = "texsys_sheet:package"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texsys_sheet = ["assets/*.json"]

[tool.uv.sources]
texsys = { workspace = true }
