schema_version = 1

[project]
name = "sheet"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[dependencies]

[package]
kind = "capability"
description = "独立维护图框、标题栏与文字的工程图页编译"
capabilities = ["projection"]
scope = "将已构建视图与项目文字组合为毫米纸面SVG草稿；不证明工程内容正确、比例尺、签章效力或施工交付深度。"
include = ["README.md"]

[package.runtime]
api_version = 1
modules = ["texsys_sheet"]
requires = ["texsys>=0.1,<0.2"]
entry_point = "texsys_sheet:package"
