[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-controls"
version = "0.1.0"
description = "Deterministic monitored isolation and changeover for Texsys"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["texsys_controls*"]
