schema_version = 1

[project]
name = "hvac-checks"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[dependencies]

[dependencies.hvac-equipment]
path = "../hvac-equipment"
version = "0.1.0"

[package]
kind = "capability"
description = "暖通容量、通风、露点与冻结资料审查"
capabilities = ["rules", "solver", "engineering"]
scope = "可复用实现与概念参数；适用输入和近似以包内说明为准，不包含具体项目的工况、现场资料或接受记录。"
include = ["README.md", "tests"]
tests = ["tests"]

[package.runtime]
api_version = 1
modules = ["texsys_hvac_checks"]
requires = ["texsys>=0.1,<0.2"]
entry_point = "texsys_hvac_checks:package"
