[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-hvac-graphics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["texsys", "texsys-diagram", "texsys-diagram-elk"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texsys_hvac_graphics = ["assets/*"]

[tool.uv.sources]
texsys = { workspace = true }
texsys-diagram = { workspace = true }
texsys-diagram-elk = { workspace = true }
