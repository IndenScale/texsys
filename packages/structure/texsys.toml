schema_version = 1

[project]
name = "structure"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[dependencies]

[dependencies.spatial]
path = "../spatial"
version = "0.1.0"

[package]
kind = "component"
description = "结构构造模块与有限承载筛查"
capabilities = ["models", "geometry", "solver"]
scope = "可复用实现与概念参数；适用输入和近似以包内说明为准，不包含具体项目的工况、现场资料或接受记录。"
include = []

[package.runtime]
api_version = 1
modules = ["texsys_structure"]
requires = ["numpy>=1.26,<3", "texsys>=0.1,<0.2"]

[package.exports]
components = ["src/library"]
