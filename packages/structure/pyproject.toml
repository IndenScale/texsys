[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-structure"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "texsys", "texsys-spatial"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["texsys_structure*"]

[tool.uv.sources]
texsys = { workspace = true }
texsys-spatial = { workspace = true }
