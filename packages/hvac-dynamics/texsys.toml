schema_version = 1

[project]
name = "hvac-dynamics"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[dependencies]

[package]
kind = "capability"
description = "准稳态水力、集总热动态及外部求解器适配"
capabilities = ["solver", "engineering"]
scope = "可复用实现与概念参数；适用输入和近似以包内说明为准，不包含具体项目的工况、现场资料或接受记录。"
include = ["README.md", "tests"]
tests = ["tests"]

[package.runtime]
api_version = 1
modules = ["texsys_hvac_dynamics"]
requires = ["texsys>=0.1,<0.2", "scipy>=1.15,<2"]
entry_point = "texsys_hvac_dynamics:package"
