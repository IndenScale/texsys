[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-datacenter-reference"
version = "0.15.0"
description = "Data center reference design component library and design-basis checks for texsys"
requires-python = ">=3.11"
dependencies = ["texsys", "texsys-bom", "texsys-electrical", "texsys-hvac-dynamics", "texsys-spatial", "texsys-structure", "numpy>=1.26,<3", "scipy>=1.15,<2"]

[project.entry-points."texsys.packages"]
datacenter-reference = "texsys_datacenter_reference:package"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
texsys = { workspace = true }
texsys-bom = { workspace = true }
texsys-electrical = { workspace = true }
texsys-hvac-dynamics = { workspace = true }
texsys-spatial = { workspace = true }
texsys-structure = { workspace = true }
