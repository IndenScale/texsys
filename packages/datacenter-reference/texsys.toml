schema_version = 1

[project]
name = "datacenter-reference"
version = "0.17.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[dependencies.structure]
path = "../structure"
version = "0.1.0"

[dependencies.architecture]
path = "../architecture"
version = "0.1.0"

[dependencies.hvac-equipment]
path = "../hvac-equipment"
version = "0.1.0"

[dependencies.bom]
path = "../bom"
version = "0.1.0"

[dependencies.spatial]
path = "../spatial"
version = "0.1.0"

[dependencies.hvac-dynamics]
path = "../hvac-dynamics"
version = "0.1.0"

[dependencies.electrical]
path = "../electrical"
version = "0.1.0"

[package]
kind = "component"
description = "数据中心参考设计器件/单元库：设备、方舱与构造体族，供下游参考设计装配"
capabilities = ["models", "geometry", "rules", "drawings"]
scope = "概念参考设计用脱敏参数与包络几何；参数状态为 assumed，不构成真实设备选型或工程接受依据。"
include = ["README.md", "tests"]
tests = ["tests"]

[package.runtime]
api_version = 1
modules = ["texsys_datacenter_reference"]
requires = ["texsys>=0.1,<0.2", "numpy>=1.26,<3", "scipy>=1.15,<2"]
entry_point = "texsys_datacenter_reference:package"

[package.exports]
components = ["src/library"]
