schema_version = 1

[project]
name = "plumbing"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[package]
kind = "capability"
description = "给排水及补排水概念计算"
capabilities = ["solver"]
scope = "可复用实现与概念参数；适用输入和近似以包内说明为准，不包含具体项目的工况、现场资料或接受记录。"
include = []

[package.runtime]
api_version = 1
modules = ["texsys_plumbing"]
requires = ["scipy>=1.15,<2"]
