[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-studio-hvac"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["texsys", "texsys-hvac-graphics"]

[project.entry-points."texsys.studio"]
hvac = "texsys_studio_hvac:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texsys_studio_hvac = ["assets/*"]

[tool.uv.sources]
texsys = { workspace = true }
texsys-hvac-graphics = { workspace = true }
