default_language = "zh"
minimum_letters = 40
minimum_passage_letters = 60
minimum_relative_distance = 0.25
detector_languages = ["zh", "en", "de", "es", "fr", "ja", "ko", "ru"]

[[path_rules]]
pattern = '(?:.*/)?(?:README|CHANGELOG)_(?P<locale>[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]+)*)\.md'

[[path_rules]]
# docs/ul/ is the shared terminology directory, not a locale directory.
pattern = 'docs/(?!ul/)(?P<locale>[a-z]{2}(?:-[A-Za-z0-9]+)*)/.+\.md'

[locales]
en = "en"
zh = "zh"
zh-cn = "zh"
zh-hans = "zh"

[overrides]
"AGENTS.md" = "en"
