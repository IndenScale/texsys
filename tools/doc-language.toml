default_language = "zh"
chinese_only_paths = '(?i)(?:.*/)?(?:README(?:[-_][^/]+)?|AGENTS)\.md'
minimum_letters = 40
minimum_passage_letters = 60
minimum_relative_distance = 0.25
detector_languages = ["zh", "en", "de", "es", "fr", "ja", "ko", "ru"]

[[path_rules]]
pattern = '(?:.*/)?CHANGELOG_(?P<locale>[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]+)*)\.md'

[[path_rules]]
# docs/ul/ 存放共享术语，按默认语言检查。
pattern = 'docs/(?!ul/)(?P<locale>[a-z]{2}(?:-[A-Za-z0-9]+)*)/.+\.md'

[locales]
en = "en"
zh = "zh"
zh-cn = "zh"
zh-hans = "zh"
