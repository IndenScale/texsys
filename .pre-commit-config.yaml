repos:
  - repo: local
    hooks:
      - id: private-reference-files
        name: Reject private files in Git
        entry: python3 src/texsys/distribution.py --staged
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: private-reference-history
        name: Reject private files before pushing Git history
        entry: python3 src/texsys/distribution.py --push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: markdownlint
        name: markdownlint with uv command policy
        entry: node node_modules/markdownlint-cli2/markdownlint-cli2.mjs
        language: system
        types: [markdown]
        pass_filenames: true
      - id: doc-language
        name: Check language of staged Markdown
        entry: uv run --locked --only-group docs-lint tools/check_doc_language.py --staged
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: ruff
        name: ruff
        entry: sh -c 'if [ -x .venv/bin/ruff ]; then exec .venv/bin/ruff check --force-exclude "$@"; elif command -v ruff >/dev/null 2>&1; then exec ruff check --force-exclude "$@"; else exec uv run ruff check --force-exclude "$@"; fi' --
        language: system
        types_or: [python, pyi]
        pass_filenames: true
      - id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js --no-warn-ignored
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
      - id: studio-no-bold
        name: Reject bold typography in Tex Studio
        entry: node tools/check_studio_typography.mjs
        language: system
        files: ^(src/texsys/assets/studio/|packages/(studio-[^/]+|[^/]+-graphics)/src/[^/]+/assets/).+\.(css|[cm]?js|jsx|ts|tsx)$
