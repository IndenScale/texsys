schema_version = 1

[project]
name = "hvac-air-cooled-room"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[build]
default_targets = ["hvac:air-room", "drawing-room"]

[build.targets.drawing-room]
using = "sheet:compose"
scope = { source = "assets/sheets/room.sheet.json" }
dependencies = ["hvac:air-room"]
output = "build/drawings/sheets/room.svg"

[dependencies]
sheet = { path = "../../packages/sheet", version = "0.1.0" }
hvac-equipment = { path = "../../packages/hvac-equipment", version = "0.1.0" }
spatial = { path = "../../packages/spatial", version = "0.1.0" }
structure = { path = "../../packages/structure", version = "0.1.0" }
