  </g>
  <g id="port-fiber" data-port="fiber">
    <circle cx="284" cy="133" r="5" fill="#f7fdff" stroke="#187e94" stroke-width="2"/>
    <text x="271" y="137" text-anchor="end" fill="#234761" font-family="sans-serif" font-size="12">fiber</text>
