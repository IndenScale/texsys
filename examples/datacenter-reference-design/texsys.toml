schema_version = 1

[project]
name = "datacenter-reference-design"

[layout]
source = "src"
assets = "assets"
build = "build"

[build]
default_targets = ["review-package"]

[dependencies]
datacenter-reference = { path = "../../packages/datacenter-reference", version = "0.10.0" }
sheet = { path = "../../packages/sheet", version = "0.2.0" }

[build.targets.review-package]
using = "dcr:review"
output = "build/review/aidc-discipline-review.json"
dependencies = [
  "dcr:design-checks",
  "dcr:bom",
  "dcr:fws-network-study",
  "dcr:fws-transient-check",
  "dcr:fws-network-coordination",
  "dcr:structure-gravity",
  "dcr:power-study",
  "dcr:fire-egress",
  "dcr:fire-systems-study",
  "dcr:fire-systems-coordination",
  "dcr:building-coordination",
  "dcr:telecom-study",
  "dcr:telecom-coordination",
  "sheet-parcel",
  "sheet-grid",
  "sheet-zoning",
  "sheet-coordination",
  "sheet-architecture-l01",
  "sheet-architecture-exit",
  "sheet-fire-egress",
  "sheet-fire-alarm",
  "sheet-fire-agent-pod",
  "sheet-fire-cause-effect",
  "sheet-structure-l01",
  "sheet-structure-footings",
  "sheet-structure-section-b",
  "sheet-it-hall",
  "sheet-electrical",
  "sheet-power-one-line-a",
  "sheet-power-one-line-b",
  "sheet-cooling",
  "sheet-fws-network",
  "sheet-fws-system",
  "sheet-fws-roof",
  "sheet-fws-section",
  "sheet-fws-isolation",
  "sheet-fws-transient-curves",
  "sheet-fws-transient-plan",
  "sheet-fws-buffers",
  "sheet-fws-buffer-section",
  "sheet-telecom-a",
  "sheet-telecom-b",
  "sheet-telecom-system",
]

[build.targets.plan-parcel]
using = "dcr:site-plan"
output = "build/drawings/views/parcel.svg"

[build.targets.sheet-parcel]
using = "sheet:compose"
dependencies = ["plan-parcel"]
scope = { source = "assets/sheets/parcel.sheet.json" }
output = "build/drawings/sheets/parcel.svg"

[build.targets.plan-grid]
using = "dcr:grid-plan"
output = "build/drawings/views/grid.svg"

[build.targets.sheet-grid]
using = "sheet:compose"
dependencies = ["plan-grid"]
scope = { source = "assets/sheets/grid.sheet.json" }
output = "build/drawings/sheets/grid.svg"

[build.targets.plan-zoning]
using = "dcr:zoning-plan"
output = "build/drawings/views/zoning.svg"

[build.targets.sheet-zoning]
