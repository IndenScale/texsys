schema_version = 1

[project]
name = "datacenter-reference-design"

[layout]
source = "src"
assets = "assets"
build = "build"

[build]
default_targets = ["review-package"]

[dependencies]
datacenter-reference = { path = "../../packages/datacenter-reference", version = "0.3.1" }
sheet = { path = "../../packages/sheet", version = "0.2.0" }

[build.targets.review-package]
using = "dcr:review"
output = "build/review/aidc-discipline-review.json"
dependencies = [
  "dcr:design-checks",
  "dcr:bom",
  "dcr:fws-hydraulics",
  "dcr:coordination-model",
  "dcr:structure-gravity",
  "dcr:power-study",
  "sheet-parcel",
  "sheet-grid",
  "sheet-zoning",
  "sheet-coordination",
  "sheet-architecture-l01",
  "sheet-structure-l01",
  "sheet-structure-footings",
  "sheet-structure-section-b",
  "sheet-it-hall",
  "sheet-electrical",
  "sheet-power-one-line-a",
  "sheet-power-one-line-b",
  "sheet-cooling",
  "sheet-fws",
]

[build.targets.plan-parcel]
using = "dcr:site-plan"
output = "build/drawings/views/parcel.svg"

[build.targets.sheet-parcel]
using = "sheet:compose"
dependencies = ["plan-parcel"]
scope = { source = "assets/sheets/parcel.sheet.json" }
output = "build/drawings/sheets/parcel.svg"

[build.targets.plan-grid]
using = "dcr:grid-plan"
output = "build/drawings/views/grid.svg"

[build.targets.sheet-grid]
using = "sheet:compose"
dependencies = ["plan-grid"]
scope = { source = "assets/sheets/grid.sheet.json" }
output = "build/drawings/sheets/grid.svg"

[build.targets.plan-zoning]
using = "dcr:zoning-plan"
output = "build/drawings/views/zoning.svg"

[build.targets.sheet-zoning]
using = "sheet:compose"
dependencies = ["plan-zoning"]
scope = { source = "assets/sheets/zoning.sheet.json" }
output = "build/drawings/sheets/zoning.svg"

[build.targets.plan-coordination]
using = "dcr:plan"
output = "build/drawings/views/coordination.svg"

[build.targets.sheet-coordination]
using = "sheet:compose"
dependencies = ["plan-coordination"]
scope = { source = "assets/sheets/coordination.sheet.json" }
output = "build/drawings/sheets/coordination.svg"

[build.targets.plan-architecture-l01]
using = "dcr:plan"
output = "build/drawings/views/architecture-l01.svg"
scope = { level = "L01", discipline = "architecture" }

[build.targets.sheet-architecture-l01]
using = "sheet:compose"
dependencies = ["plan-architecture-l01"]
scope = { source = "assets/sheets/architecture-l01.sheet.json" }
output = "build/drawings/sheets/architecture-l01.svg"

[build.targets.plan-structure-l01]
using = "dcr:structure-view"
output = "build/drawings/views/structure-l01.svg"
scope = { view = "frame" }

[build.targets.sheet-structure-l01]
using = "sheet:compose"
dependencies = ["plan-structure-l01"]
scope = { source = "assets/sheets/structure-l01.sheet.json" }
output = "build/drawings/sheets/structure-l01.svg"

[build.targets.plan-it-hall]
using = "dcr:plan"
output = "build/drawings/views/it-hall.svg"
scope = { zone = "IT-HALL", discipline = "it" }

[build.targets.sheet-it-hall]
using = "sheet:compose"
dependencies = ["plan-it-hall"]
scope = { source = "assets/sheets/it-hall.sheet.json" }
output = "build/drawings/sheets/it-hall.svg"

[build.targets.plan-electrical]
using = "dcr:plan"
output = "build/drawings/views/electrical.svg"
scope = { discipline = "electrical" }

[build.targets.sheet-electrical]
using = "sheet:compose"
dependencies = ["plan-electrical"]
scope = { source = "assets/sheets/electrical.sheet.json" }
output = "build/drawings/sheets/electrical.svg"

[build.targets.plan-cooling]
using = "dcr:plan"
output = "build/drawings/views/cooling.svg"
scope = { zone = "COOLING", discipline = "mechanical" }

[build.targets.sheet-cooling]
using = "sheet:compose"
dependencies = ["plan-cooling"]
scope = { source = "assets/sheets/cooling.sheet.json" }
output = "build/drawings/sheets/cooling.svg"

[build.targets.plan-fws]
using = "dcr:fws-plan"
output = "build/drawings/views/fws.svg"

[build.targets.sheet-fws]
using = "sheet:compose"
dependencies = ["plan-fws"]
scope = { source = "assets/sheets/fws.sheet.json" }
output = "build/drawings/sheets/fws.svg"

[build.targets.plan-structure-footings]
using = "dcr:structure-view"
output = "build/drawings/views/structure-footings.svg"
scope = { view = "footings" }

[build.targets.sheet-structure-footings]
using = "sheet:compose"
dependencies = ["plan-structure-footings"]
scope = { source = "assets/sheets/structure-footings.sheet.json" }
output = "build/drawings/sheets/structure-footings.svg"

[build.targets.plan-structure-section-b]
using = "dcr:structure-view"
output = "build/drawings/views/structure-section-b.svg"
scope = { view = "section", axis = "B" }

[build.targets.sheet-structure-section-b]
using = "sheet:compose"
dependencies = ["plan-structure-section-b"]
scope = { source = "assets/sheets/structure-section-b.sheet.json" }
output = "build/drawings/sheets/structure-section-b.svg"

[build.targets.plan-power-one-line-a]
using = "dcr:power-view"
output = "build/drawings/views/power-one-line-a.svg"
scope = { train = "A" }

[build.targets.sheet-power-one-line-a]
using = "sheet:compose"
dependencies = ["plan-power-one-line-a"]
scope = { source = "assets/sheets/power-one-line-a.sheet.json" }
output = "build/drawings/sheets/power-one-line-a.svg"

[build.targets.plan-power-one-line-b]
using = "dcr:power-view"
output = "build/drawings/views/power-one-line-b.svg"
scope = { train = "B" }

[build.targets.sheet-power-one-line-b]
using = "sheet:compose"
dependencies = ["plan-power-one-line-b"]
scope = { source = "assets/sheets/power-one-line-b.sheet.json" }
output = "build/drawings/sheets/power-one-line-b.svg"
