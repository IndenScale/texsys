schema_version = 1

[project]
name = "datacenter-reference-design"

[layout]
source = "src"
assets = "assets"
build = "build"

[build]
default_targets = ["review-package"]

[dependencies]
datacenter-reference = { path = "../../packages/datacenter-reference", version = "0.31.0" }
sheet = { path = "../../packages/sheet", version = "0.2.0" }

