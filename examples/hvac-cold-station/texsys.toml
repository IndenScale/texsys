schema_version = 1

[project]
name = "hvac-cold-station"

[layout]
source = "src"
assets = "assets"
build = "build"

[build]
default_targets = [
  "hvac:equipment-bom",
  "hvac:equipment-layout",
  "hvac:equipment-projection",
  "hvac:design-checks",
]

[dependencies]
hvac-bom = { path = "../../packages/hvac-bom", version = "0.1.0" }
hvac-equipment = { path = "../../packages/hvac-equipment", version = "0.1.0" }
hvac-formatter = { path = "../../packages/hvac-formatter", version = "0.1.0" }
hvac-linter = { path = "../../packages/hvac-linter", version = "0.1.0" }
hvac-checks = { path = "../../packages/hvac-checks", version = "0.1.0" }

[[build.hooks]]
id = "hvac.check-bom"
target = "hvac:equipment-bom"
phase = "post"
command = ["hvac-check-bom"]
inputs = ["artifact:bom-data"]
outputs = ["build/hvac/bom-check.json"]
timeout_seconds = 60
tool_version = "0.1.0"
closure = "authoritative"
