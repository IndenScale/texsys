name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private files in Git history
        run: python3 src/texsys/distribution.py --revision HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize locked Python environment
        run: uv sync --locked

      - name: Check language of Markdown changed in the PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --locked --only-group docs-lint -m unittest discover -s tools -p test_doc_language.py
          uv run --locked --only-group docs-lint tools/check_doc_language.py --base "$PR_BASE" --head "$PR_HEAD"

      - name: Install integrity-checked local Node tools
        run: uv run tools/sync_node_tools.py

      - name: Run unit and examples end-to-end tests
        run: uv run pytest

      - name: Verify public examples
        run: |
          uv run texsys check -p examples/minimal
          uv run texsys check -p examples/hvac-cold-station
          uv run texsys check -p examples/hvac-system-schematic
          uv run texsys check -p examples/hvac-dynamic-station
          uv run texsys format --check -p examples/hvac-dynamic-station
          uv run texsys lock --check -p examples/hvac-dynamic-station
          uv run texsys format --check -p examples/minimal
          uv run texsys format --check -p examples/hvac-cold-station
          uv run texsys format --check -p examples/hvac-system-schematic
          uv run texsys lock --check -p examples/hvac-system-schematic
          uv run texsys build -p examples/hvac-system-schematic

      - name: Check documentation and command policy
        run: |
          node node_modules/prettier/bin/prettier.cjs --check .
          node node_modules/markdownlint-cli2/markdownlint-cli2.mjs "**/*.md"
          node --test tools/markdownlint-rules/no-python-pip-commands.test.cjs

      - name: Check engineering geometry and TypeScript
        run: |
          node --test tools/test_graphics.mjs
          node --test tools/test_studio_ui.mjs
          node --test tools/test_studio_editor_groups.mjs tools/test_navigator_menu.mjs tools/test_explorer_tree.mjs tools/test_markdown_ui.mjs tools/test_markdown_editor.mjs
          node node_modules/typescript/bin/tsc --noEmit --strict --jsx react-jsx --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom --skipLibCheck packages/hvac-graphics/src/texsys_hvac_graphics/assets/*.ts packages/hvac-graphics/src/texsys_hvac_graphics/assets/*.tsx
          node node_modules/typescript/bin/tsc --noEmit --strict --jsx react-jsx --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom --skipLibCheck src/texsys/assets/studio/*.ts src/texsys/assets/studio/*.tsx packages/studio-hvac/src/texsys_studio_hvac/assets/*.tsx
