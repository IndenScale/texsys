[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys"
version = "0.1.0"
description = "Reference implementation, toolchain and ecosystem for SDL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tomlkit>=0.13,<1",
  "typer>=0.27,<1",
  "usd-core>=25.5,<27",
]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "texsys-bom", "texsys-hvac-dynamics", "texsys-hvac-bom", "texsys-hvac-equipment", "texsys-hvac-formatter", "texsys-hvac-linter", "texsys-hvac-checks"]

[project.scripts]
texsys = "texsys.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texsys = ["assets/*.usda"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
texsys-bom = { workspace = true }
texsys-hvac-dynamics = { workspace = true }
texsys-hvac-bom = { workspace = true }
texsys-hvac-equipment = { workspace = true }
texsys-hvac-formatter = { workspace = true }
texsys-hvac-linter = { workspace = true }
texsys-hvac-checks = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: large deterministic end-to-end fixture",
]
