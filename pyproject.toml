[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys"
version = "0.1.1"
description = "Reference implementation, toolchain and ecosystem for SDL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24,<27",
  "tomlkit>=0.13,<1",
  "typer>=0.27,<1",
  "usd-core>=25.5,<27",
  "wsproto>=1.2,<2",
]

[dependency-groups]
docs-lint = [
  "lingua-language-detector>=2.1,<3",
  "markdown-it-py>=3,<5",
]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
  "texsys-datacenter",
  "texsys-bom",
  "texsys-diagram",
  "texsys-sheet",
  "texsys-diagram-elk",
  "texsys-hvac-graphics",
  "texsys-hvac-diagram",
  "texsys-hvac-dynamics",
  "texsys-hvac-bom",
  "texsys-hvac-equipment",
  "texsys-hvac-formatter",
  "texsys-hvac-linter",
  "texsys-hvac-checks",
  "texsys-studio-hvac",
]

[project.scripts]
texsys = "texsys.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texsys = ["assets/*.usda", "assets/studio/*", "assets/studio/atomstudio/*"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
texsys-datacenter = { workspace = true }
texsys-bom = { workspace = true }
texsys-diagram = { workspace = true }
texsys-sheet = { workspace = true }
texsys-diagram-elk = { workspace = true }
texsys-hvac-graphics = { workspace = true }
texsys-hvac-diagram = { workspace = true }
texsys-hvac-dynamics = { workspace = true }
texsys-hvac-bom = { workspace = true }
texsys-hvac-equipment = { workspace = true }
texsys-hvac-formatter = { workspace = true }
texsys-hvac-linter = { workspace = true }
texsys-hvac-checks = { workspace = true }
texsys-studio-hvac = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: large deterministic end-to-end fixture",
]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

